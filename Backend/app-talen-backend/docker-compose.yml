services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-talen-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: talent_db
      TYPEORM_SYNC: "true"
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16-alpine
    container_name: app-talen-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talent_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
