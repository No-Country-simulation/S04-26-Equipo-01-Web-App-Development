services:
  backend:
    build:
      context: ./Backend/app-talen-backend
      dockerfile: Dockerfile
    container_name: app-talen-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: talent_db
      TYPEORM_SYNC: "true"
      JWT_SECRET: change-this-secret
      JWT_EXPIRES_IN: 7d
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./Frontend/appTalenFront
      dockerfile: Dockerfile
    container_name: app-talen-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

  postgres:
    image: postgres:16-alpine
    container_name: app-talen-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talent_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talent_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
